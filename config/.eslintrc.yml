env:
  browser: true
  es2021: true
  node: true
extends:
  - eslint:recommended
  - plugin:@typescript-eslint/recommended
  - plugin:prettier/recommended
  - prettier
overrides:
  # Type-level test files assert types via bare member expressions (often
  # paired with @ts-expect-error); they are expressions on purpose.
  - files:
      - "*.test-types.ts"
      - "*.test-types.tsx"
    rules:
      "@typescript-eslint/no-unused-expressions": "off"
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: latest
  sourceType: module
plugins:
  - "@typescript-eslint"
rules:
  linebreak-style:
    - error
    - unix
  quotes:
    - error
    - double
    - avoidEscape: true
  semi:
    - error
    - always
  "@typescript-eslint/no-unused-vars":
    - error
    - varsIgnorePattern: "[iI]gnored"
      argsIgnorePattern: "[iI]gnored"
      caughtErrorsIgnorePattern: "[iI]gnored"
  "@typescript-eslint/no-explicit-any":
    - error
    - ignoreRestArgs: true
